<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>座りっぱなし対策タイマー「うごこ。」 | デスクワークの健康管理ツール</title>
  <link rel="manifest" href="/manifest.json">

  <style>
    :root {
      --bg-color: #F2F4F7;
      --card-bg: #FFFFFF;
      --text-main: #1C1C1E;
      --text-sub: #8E8E93;
      --accent-green: #34C759;
      --accent-green-dark: #2da14f;
      --accent-orange: #FF9500;
      --btn-inactive-bg: #E5E5EA;
      --btn-inactive-text: #3A3A3C;
      --border-color: rgba(60, 60, 67, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; }

    /* Apple風カードデザイン */
    .container {
      width: 100%;
      max-width: 380px;
      background: var(--card-bg);
      border-radius: 32px;
      padding: 28px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
      border: 1px solid var(--border-color);
      text-align: center;
      position: relative;
    }
    .brand-title { font-size: 30px; font-weight: 700; color: var(--text-main); margin-bottom: 4px; letter-spacing: -0.5px; }
    .brand-concept { font-size: 13px; color: var(--text-sub); margin-bottom: 16px; font-weight: 400; }

    /* 今日の実績サマリー */
    .today-summary {
      background: #F8F9FA;
      border-radius: 20px;
      padding: 12px 16px;
      margin-bottom: 18px;
      font-size: 13px;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      gap: 6px;
      border: 1px solid rgba(0,0,0,0.03);
    }
    .summary-row { display: flex; justify-content: space-between; align-items: center; }
    .summary-label { font-weight: 500; color: var(--text-sub); font-size: 13px; }
    .today-time { font-size: 15px; color: var(--accent-green); font-weight: 700; }
    .today-move { font-size: 15px; color: var(--accent-orange); font-weight: 700; }

    @keyframes bonbon {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.35); }
      100% { transform: scale(1); }
    }

    .bonbon-emoji {
      display: inline-block;
      font-size: 24px;
      vertical-align: middle;
      margin: 0 4px;
      background: #333;
      padding: 2px 10px;
      border-radius: 8px;
      border: 1px solid #555;
      animation: bonbon 0.8s infinite ease-in-out;
    }

    .sticky-toast {
      position: fixed;
      bottom: -250px;
      right: 20px;
      width: 320px;
      max-width: calc(100vw - 40px);
      background: #1C1C1E;
      color: #FFFFFF;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.25);
      transition: bottom 0.3s ease-out;
      z-index: 9999;
      text-align: left;
      cursor: pointer;
    }
    .sticky-toast.show { bottom: 20px; }
    .toast-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; color: #FFF; }
    .toast-body { font-size: 13px; color: #E5E5EA; line-height: 1.6; }

    .chara-img { max-width: 90px; max-height: 90px; width: auto; height: auto; object-fit: contain; display: block; margin: 0 auto 10px auto; }
    .status-badge { display: inline-block; padding: 6px 18px; border-radius: 9999px; font-size: 13px; font-weight: 600; background: #E8F8EC; color: var(--accent-green); margin-bottom: 8px; }
    .timer-display { font-size: 64px; font-weight: 200; letter-spacing: -1.5px; margin: 0 0 16px; color: var(--text-main); font-variant-numeric: tabular-nums; }

    .setting-group { margin-bottom: 16px; text-align: left; }
    .setting-label { font-size: 13px; color: var(--text-sub); margin-bottom: 8px; display: block; font-weight: 600; padding-left: 4px; }
    .options-grid { display: flex; gap: 8px; }
    
    /* Apple風カプセル型ボタン */
    .opt-btn {
      flex: 1;
      background: var(--btn-inactive-bg);
      border: none;
      border-radius: 9999px; /* 完全なカプセル型 */
      padding: 10px 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--btn-inactive-text);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .opt-btn.active {
      background: var(--accent-green);
      color: #FFF;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(52, 199, 89, 0.3);
    }
    .opt-btn:active {
      transform: scale(0.96);
    }
    
    /* メインのスタートボタン */
    .start-btn {
      width: 100%;
      background: var(--accent-green);
      color: #FFF;
      border: none;
      border-radius: 9999px; /* カプセル型 */
      padding: 16px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(52, 199, 89, 0.35);
    }
    .start-btn:active {
      background: var(--accent-green-dark);
      transform: scale(0.98);
    }

    .test-area { margin-top: 16px; padding-top: 12px; border-top: 1px dashed var(--border-color); }
    .test-note { font-size: 11px; color: var(--text-sub); line-height: 1.4; }
    .test-btn { background: transparent; border: none; color: var(--accent-green); font-size: 12px; font-weight: 600; cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>

  <div id="stickyToast" class="sticky-toast" onclick="handleToastClick()">
    <div class="toast-title" id="toastTitle"></div>
    <div class="toast-body" id="toastBody"></div>
  </div>

  <div class="container">
    <div class="brand-title">うごこ。</div>
    <div class="brand-concept">座りっぱなしを、ちょっと減らそう。</div>

    <!-- 今日の実績サマリー -->
    <div class="today-summary">
      <div class="summary-row">
        <span class="summary-label">💻 今日の座り時間</span>
        <span id="todayTimeDisplay" class="today-time">0分</span>
      </div>
      <div class="summary-row" style="border-top: 1px dashed #E5E5EA; padding-top: 6px; margin-top: 2px;">
        <span class="summary-label">🏃‍♂️ 今日のうごき実績</span>
        <span id="todayMoveDisplay" class="today-move">0回 (0分)</span>
      </div>
    </div>

    <img id="charaImg" src="chara-focus.png" alt="うごこ。" class="chara-img">
    <div id="statusBadge" class="status-badge">作業タイム</div>
    <div class="timer-display" id="timerDisplay">30:00</div>

    <div class="setting-group">
      <span class="setting-label">作業時間</span>
      <div class="options-grid" id="focusGroup">
        <button class="opt-btn" data-val="25" onclick="setFocusTime(25, this)">25分</button>
        <button class="opt-btn" data-val="30" onclick="setFocusTime(30, this)">30分</button>
        <button class="opt-btn" data-val="45" onclick="setFocusTime(45, this)">45分</button>
        <button class="opt-btn" data-val="50" onclick="setFocusTime(50, this)">50分</button>
      </div>
    </div>

    <div class="setting-group">
      <span class="setting-label">うごく時間</span>
      <div class="options-grid" id="moveGroup">
        <button class="opt-btn" data-val="1" onclick="setMoveTime(1, this)">1分</button>
        <button class="opt-btn" data-val="2" onclick="setMoveTime(2, this)">2分</button>
        <button class="opt-btn" data-val="3" onclick="setMoveTime(3, this)">3分</button>
        <button class="opt-btn" data-val="5" onclick="setMoveTime(5, this)">5分</button>
      </div>
    </div>

    <button class="start-btn" id="startBtn" onclick="handleStartClick()">スタート</button>
    
    <div class="test-area">
      <button class="test-btn" onclick="testTimer(5)">⚡ 5秒テスト（動作確認用）</button>
      <div class="test-note" style="margin-top: 4px;">↑ テスト確認用ボタンです</div>
    </div>
  </div>

  <script>
    var focusMinutes = 30, moveMinutes = 2, timeLeft = focusMinutes * 60, isRunning = false, endTime = 0;
    var mode = "focus";
    var blinkInterval = null;
    var audioCtx = null;
    var activeNotification = null;
    var swRegistration = null;
    
    var todayFocusSeconds = 0;
    var todayMoveCount = 0;
    var todayMoveSeconds = 0;

    // Web Worker (タイマー精度の維持)
    var workerCode = `
      let timer = null;
      onmessage = function(e) {
        if (e.data === 'start') {
          if (timer) clearInterval(timer);
          timer = setInterval(() => postMessage('tick'), 250);
        } else if (e.data === 'stop') {
          if (timer) { clearInterval(timer); timer = null; }
        }
      };
    `;
    var workerBlob = new Blob([workerCode], { type: 'application/javascript' });
    var worker = new Worker(URL.createObjectURL(workerBlob));

    worker.onmessage = function() {
      if (isRunning) checkTimer();
    };

    // 初期化処理
    window.onload = function() {
      registerServiceWorker();
      loadSavedSettings(); // 前回設定の読み込み
      loadTodayData();
      updateDisplay();
    };

    // Service Workerの登録
    function registerServiceWorker() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').then(function(reg) {
          swRegistration = reg;
        }).catch(function(err) {
          console.log('SW登録失敗:', err);
        });
      }
    }

    // 前回設定（ローカルストレージ）の読み込み・適用
    function loadSavedSettings() {
      var savedFocus = localStorage.getItem('ugoko_saved_focus');
      var savedMove = localStorage.getItem('ugoko_saved_move');

      if (savedFocus) {
        focusMinutes = parseInt(savedFocus, 10);
      }
      if (savedMove) {
        moveMinutes = parseInt(savedMove, 10);
      }

      // UIに反映
      applyActiveButton('focusGroup', focusMinutes);
      applyActiveButton('moveGroup', moveMinutes);

      timeLeft = (mode === 'focus' ? focusMinutes : moveMinutes) * 60;
    }

    function applyActiveButton(groupId, val) {
      var group = document.getElementById(groupId);
      if (!group) return;
      var btns = group.getElementsByTagName('button');
      for (var i = 0; i < btns.length; i++) {
        if (parseInt(btns[i].getAttribute('data-val'), 10) === val) {
          btns[i].className = 'opt-btn active';
        } else {
          btns[i].className = 'opt-btn';
        }
      }
    }

    function padZero(n) { return n < 10 ? '0' + n : '' + n; }

    function getTodayKey() {
      var d = new Date();
      return d.getFullYear() + '-' + padZero(d.getMonth() + 1) + '-' + padZero(d.getDate());
    }

    function loadTodayData() {
      var todayKey = getTodayKey();
      var savedDate = localStorage.getItem('ugoko_last_date');
      
      if (savedDate !== todayKey) {
        localStorage.setItem('ugoko_last_date', todayKey);
        localStorage.setItem('ugoko_today_seconds', 0);
        localStorage.setItem('ugoko_today_move_count', 0);
        localStorage.setItem('ugoko_today_move_seconds', 0);
        todayFocusSeconds = 0;
        todayMoveCount = 0;
        todayMoveSeconds = 0;
      } else {
        todayFocusSeconds = parseInt(localStorage.getItem('ugoko_today_seconds') || 0, 10);
        todayMoveCount = parseInt(localStorage.getItem('ugoko_today_move_count') || 0, 10);
        todayMoveSeconds = parseInt(localStorage.getItem('ugoko_today_move_seconds') || 0, 10);
      }
      renderTodayTime();
    }

    function renderTodayTime() {
      var totalMinutes = Math.floor(todayFocusSeconds / 60);
      var h = Math.floor(totalMinutes / 60);
      var m = totalMinutes % 60;
      var textFocus = (h > 0 ? h + "時間 " : "") + m + "分";
      document.getElementById('todayTimeDisplay').innerText = textFocus;

      var moveTotalM = Math.floor(todayMoveSeconds / 60);
      var textMove = todayMoveCount + "回 (" + moveTotalM + "分)";
      document.getElementById('todayMoveDisplay').innerText = textMove;
    }

    function initAudio() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.001);
      } catch(e) {}
    }

    function requestNotificationPermission() {
      if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
        Notification.requestPermission();
      }
    }

    function handleStartClick() {
      requestNotificationPermission();
      initAudio();
      toggleTimer();
    }

    function playAudio() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        var notes = [523.25, 659.25, 783.99];
        notes.forEach(function(freq, index) {
          var startTime = audioCtx.currentTime + (index * 0.15);
          var osc = audioCtx.createOscillator();
          var gain = audioCtx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, startTime);
          gain.gain.setValueAtTime(0.2, startTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.6);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(startTime);
          osc.stop(startTime + 0.6);
        });
      } catch(e) {}
    }

    function showStickyToast(title, bodyHTML) {
      document.getElementById('toastTitle').innerText = title;
      document.getElementById('toastBody').innerHTML = bodyHTML;
      document.getElementById('stickyToast').classList.add('show');
    }

    function closeToast() {
      document.getElementById('stickyToast').classList.remove('show');
      if (activeNotification) {
        activeNotification.close();
        activeNotification = null;
      }
    }

    function handleToastClick() {
      closeToast();
      stopBlinkingTitle();

      if (mode === 'focus') {
        switchMode('move');
      } else {
        switchMode('focus');
      }
      startTimer();
    }

    function startBlinkingTitle(msg) {
      stopBlinkingTitle();
      var toggle = false;
      blinkInterval = setInterval(function() {
        document.title = toggle ? msg : "【うごこ。】";
        toggle = !toggle;
      }, 800);
    }

    function stopBlinkingTitle() {
      if (blinkInterval) {
        clearInterval(blinkInterval);
        blinkInterval = null;
      }
    }

    // 画面オフ対応の背景通知処理
    function sendNotification(title, mainMessage, emoji, nextModeName) {
      try { playAudio(); } catch(e) {}
      startBlinkingTitle("🔔 " + title);
      
      var plainText = mainMessage + "\n" +
        "ここをクリック 👉 【 " + emoji + " 】 👈 で『" + nextModeName + "』を始めよう！";

      var htmlText = mainMessage + "<br>" +
        "ここをクリック 👉 <span class='bonbon-emoji'>" + emoji + "</span> 👈 で『" + nextModeName + "』を始めよう！<br>" +
        "<span style='font-size: 11px; color: #aaa;'>※「×(閉じる)」は押さないでね</span>";

      showStickyToast(title, htmlText);

      // バックグラウンド／スリープ時は Service Worker を経由して通知を発火
      if (Notification.permission === "granted") {
        if (navigator.serviceWorker && navigator.serviceWorker.controller) {
          navigator.serviceWorker.controller.postMessage({
            type: 'SHOW_NOTIFICATION',
            title: title,
            body: plainText
          });
        } else {
          try {
            activeNotification = new Notification(title, { body: plainText, requireInteraction: true });
            activeNotification.onclick = function() {
              window.focus();
              handleToastClick();
            };
          } catch(e) {}
        }
      }
    }

    window.addEventListener('focus', function() {
      loadTodayData();
      if (isRunning) checkTimer();
      else updateDisplay();
    });

    function updateDisplay() {
      var m = padZero(Math.floor(timeLeft / 60));
      var s = padZero(timeLeft % 60);
      document.getElementById('timerDisplay').innerText = m + ':' + s;
      if (!blinkInterval) {
        document.title = '(' + m + ':' + s + ') うごこ。';
      }
    }

    function switchMode(newMode) {
      mode = newMode;
      var img = document.getElementById('charaImg');
      var badge = document.getElementById('statusBadge');

      if (mode === 'focus') {
        img.src = 'chara-focus.png';
        badge.innerText = '作業タイム';
        badge.style.background = '#E8F8EC';
        badge.style.color = '#34C759';
        timeLeft = focusMinutes * 60;
      } else {
        img.src = 'chara-move.png';
        badge.innerText = 'うごくタイム';
        badge.style.background = '#FFF3E0';
        badge.style.color = '#FF9500';
        timeLeft = moveMinutes * 60;
      }
      updateDisplay();
    }

    function setFocusTime(m, el) {
      if (isRunning) return;
      focusMinutes = m;
      localStorage.setItem('ugoko_saved_focus', m); // 設定を保存
      if (mode === 'focus') timeLeft = m * 60;
      updateDisplay();
      var btns = el.parentElement.getElementsByTagName('button');
      for (var i = 0; i < btns.length; i++) btns[i].className = 'opt-btn';
      el.className = 'opt-btn active';
    }

    function setMoveTime(m, el) {
      if (isRunning) return;
      moveMinutes = m;
      localStorage.setItem('ugoko_saved_move', m); // 設定を保存
      if (mode === 'move') timeLeft = m * 60;
      updateDisplay();
      var btns = el.parentElement.getElementsByTagName('button');
      for (var i = 0; i < btns.length; i++) btns[i].className = 'opt-btn';
      el.className = 'opt-btn active';
    }

    function testTimer(s) {
      requestNotificationPermission();
      initAudio();
      closeToast();
      stopBlinkingTitle();
      isRunning = false;
      worker.postMessage('stop');
      timeLeft = s;
      updateDisplay();
      toggleTimer();
    }

    function toggleTimer() {
      if (isRunning) {
        isRunning = false;
        worker.postMessage('stop');
        document.getElementById('startBtn').innerText = 'スタート';
      } else {
        startTimer();
      }
    }

    function startTimer() {
      isRunning = true;
      document.getElementById('startBtn').innerText = '一時停止';
      endTime = (new Date()).getTime() + timeLeft * 1000;
      worker.postMessage('start');
    }

    function checkTimer() {
      var remainingMs = endTime - (new Date()).getTime();
      if (remainingMs <= 0) {
        isRunning = false;
        worker.postMessage('stop');
        document.getElementById('startBtn').innerText = 'スタート';
        timeLeft = 0;
        updateDisplay();
        
        loadTodayData();

        if (mode === 'focus') {
          todayFocusSeconds += focusMinutes * 60;
          localStorage.setItem('ugoko_today_seconds', todayFocusSeconds);
          renderTodayTime();

          sendNotification(
            "🚶‍♂️ そろそろ、うごこ！",
            focusMinutes + "分経ちました！身体をほぐしましょう！",
            "🚶‍♂️",
            "うごくタイム"
          );
        } else {
          todayMoveCount += 1;
          todayMoveSeconds += moveMinutes * 60;
          localStorage.setItem('ugoko_today_move_count', todayMoveCount);
          localStorage.setItem('ugoko_today_move_seconds', todayMoveSeconds);
          renderTodayTime();

          sendNotification(
            "💻 おつかれさまでした！",
            "リフレッシュ完了！作業に戻りましょう！",
            "💻",
            "作業タイム"
          );
        }
      } else {
        timeLeft = Math.ceil(remainingMs / 1000);
        updateDisplay();
      }
    }
  </script>
</body>
</html>
