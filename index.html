<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>うごこ。 | ugoko - 座りっぱなしを、ちょっと減らそう。</title>
  <style>
    :root {
      --bg-color: #F2F4F2;
      --card-bg: #FAFCFA;
      --text-main: #2D3531;
      --text-sub: #78887F;
      --accent-green: #68A865;
      --border-color: #E0E5E1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    
    .container { width: 100%; max-width: 380px; background: var(--card-bg); border-radius: 24px; padding: 28px 20px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.04); border: 1px solid var(--border-color); text-align: center; }
    .brand-title { font-size: 28px; font-weight: 700; color: var(--text-main); margin-bottom: 2px; }
    .brand-concept { font-size: 12px; color: var(--text-sub); margin-bottom: 16px; }

    .chara-img {
      max-width: 110px;
      max-height: 110px;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      margin: 0 auto 12px auto;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      background: #E6F0E6;
      color: var(--accent-green);
      margin-bottom: 8px;
    }

    .timer-display {
      font-size: 56px;
      font-weight: 500;
      letter-spacing: 1px;
      margin: 4px 0 16px;
      color: var(--text-main);
    }

    .setting-group { margin-bottom: 14px; text-align: left; }
    .setting-label { font-size: 12px; color: var(--text-sub); margin-bottom: 6px; display: block; }
    .options-grid { display: flex; gap: 6px; }
    .opt-btn { flex: 1; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; padding: 8px 0; font-size: 12px; color: var(--text-main); cursor: pointer; }
    .opt-btn.active { background: var(--accent-green); color: #FFF; border-color: var(--accent-green); font-weight: 600; }
    
    .start-btn {
      width: 100%;
      background: var(--accent-green);
      color: #FFF;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 2px;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s;
    }
    .start-btn:hover { opacity: 0.9; }
    .test-btn { width: 100%; background: transparent; border: none; color: var(--text-sub); font-size: 11px; margin-top: 10px; cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>

  <div class="container">
    <div class="brand-title">うごこ。</div>
    <div class="brand-concept">座りっぱなしを、ちょっと減らそう。</div>

    <img id="charaImg" src="chara-focus.png" alt="うごこ。キャラクター" class="chara-img">
    
    <div id="statusBadge" class="status-badge">集中タイム（Focus）</div>

    <div class="timer-display" id="timerDisplay">30:00</div>

    <div class="setting-group">
      <span class="setting-label">集中時間（Focus）</span>
      <div class="options-grid">
        <button class="opt-btn" onclick="setFocusTime(25, this)">25分</button>
        <button class="opt-btn active" onclick="setFocusTime(30, this)">30分</button>
        <button class="opt-btn" onclick="setFocusTime(45, this)">45分</button>
        <button class="opt-btn" onclick="setFocusTime(50, this)">50分</button>
      </div>
    </div>

    <div class="setting-group">
      <span class="setting-label">動く時間（Move）</span>
      <div class="options-grid">
        <button class="opt-btn" onclick="setMoveTime(1, this)">1分</button>
        <button class="opt-btn active" onclick="setMoveTime(2, this)">2分</button>
        <button class="opt-btn" onclick="setMoveTime(3, this)">3分</button>
        <button class="opt-btn" onclick="setMoveTime(5, this)">5分</button>
      </div>
    </div>

    <button class="start-btn" id="startBtn" onclick="toggleTimer()">スタート</button>
    <button class="test-btn" onclick="testTimer(5)">⚡ 5秒テスト（動作確認用）</button>
  </div>

  <script>
    var focusMinutes = 30, moveMinutes = 2, timeLeft = focusMinutes * 60, isRunning = false, endTime = 0;
    var mode = "focus";
    var blinkInterval = null;
    var audioCtx = null;

    // 単一のWeb Workerを生成して使い回す（メモリリーク防止）
    var workerCode = `
      let timer = null;
      onmessage = function(e) {
        if (e.data === 'start') {
          if (timer) clearInterval(timer);
          timer = setInterval(() => postMessage('tick'), 250);
        } else if (e.data === 'stop') {
          if (timer) { clearInterval(timer); timer = null; }
        }
      };
    `;
    var workerBlob = new Blob([workerCode], { type: 'application/javascript' });
    var worker = new Worker(URL.createObjectURL(workerBlob));

    worker.onmessage = function() {
      if (isRunning) checkTimer();
    };

    // オーディオ再生権限のロック解除（Audio Unlocking）
    function initAudio() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        // 0.001秒の無音を出力してブラウザに許可させる
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.001);
      } catch(e) {}
    }

    function requestNotificationPermission() {
      if ("Notification" in window && Notification.permission === "default") {
        Notification.requestPermission();
      }
      initAudio();
    }

    // チャイム音再生（ド・ミ・ソ♪）
    function playAudio() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        var notes = [523.25, 659.25, 783.99]; // ド, ミ, ソ
        notes.forEach(function(freq, index) {
          var startTime = audioCtx.currentTime + (index * 0.15);
          var osc = audioCtx.createOscillator();
          var gain = audioCtx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, startTime);
          gain.gain.setValueAtTime(0.2, startTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.6);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(startTime);
          osc.stop(startTime + 0.6);
        });
      } catch(e) {
        console.log("Audio Error:", e);
      }
    }

    // タブタイトル点滅処理
    function startBlinkingTitle(msg) {
      stopBlinkingTitle();
      var toggle = false;
      blinkInterval = setInterval(function() {
        document.title = toggle ? msg : "【うごこ。】";
        toggle = !toggle;
      }, 800);
    }

    function stopBlinkingTitle() {
      if (blinkInterval) {
        clearInterval(blinkInterval);
        blinkInterval = null;
      }
    }

    // デスクトップ通知送信
    function sendNotification(title, body) {
      playAudio();
      startBlinkingTitle("🔔 " + title);

      if ("Notification" in window && Notification.permission === "granted") {
        try {
          var n = new Notification(title, { 
            body: body,
            icon: mode === 'move' ? 'chara-move.png' : 'chara-focus.png',
            requireInteraction: true
          });
          n.onclick = function() { 
            window.focus(); 
            stopBlinkingTitle();
            n.close();
          };
        } catch(e) {
          console.log("Notification Error:", e);
        }
      }
    }

    // フォーカス復帰時のタイトル復元
    window.addEventListener('focus', function() {
      stopBlinkingTitle();
      if (isRunning) checkTimer();
      else updateDisplay();
    });

    function padZero(n) { return n < 10 ? '0' + n : '' + n; }

    function updateDisplay() {
      var m = padZero(Math.floor(timeLeft / 60));
      var s = padZero(timeLeft % 60);
      document.getElementById('timerDisplay').innerText = m + ':' + s;
      if (!blinkInterval) {
        document.title = '(' + m + ':' + s + ') うごこ。';
      }
    }

    function switchMode(newMode) {
      mode = newMode;
      var img = document.getElementById('charaImg');
      var badge = document.getElementById('statusBadge');

      if (mode === 'focus') {
        img.src = 'chara-focus.png';
        badge.innerText = '集中タイム（Focus）';
        badge.style.background = '#E6F0E6';
        badge.style.color = '#68A865';
        timeLeft = focusMinutes * 60;
      } else {
        img.src = 'chara-move.png';
        badge.innerText = '動くタイム（Move）';
        badge.style.background = '#FFF3E0';
        badge.style.color = '#E67E22';
        timeLeft = moveMinutes * 60;
      }
      updateDisplay();
    }

    function setFocusTime(m, el) {
      if (isRunning) return;
      focusMinutes = m;
      if (mode === 'focus') timeLeft = m * 60;
      updateDisplay();
      var btns = el.parentElement.getElementsByTagName('button');
      for (var i = 0; i < btns.length; i++) btns[i].className = 'opt-btn';
      el.className = 'opt-btn active';
    }

    function setMoveTime(m, el) {
      if (isRunning) return;
      moveMinutes = m;
      if (mode === 'move') timeLeft = m * 60;
      updateDisplay();
      var btns = el.parentElement.getElementsByTagName('button');
      for (var i = 0; i < btns.length; i++) btns[i].className = 'opt-btn';
      el.className = 'opt-btn active';
    }

    function testTimer(s) {
      requestNotificationPermission();
      stopBlinkingTitle();
      isRunning = false;
      worker.postMessage('stop');
      timeLeft = s;
      updateDisplay();
      startTimer();
    }

    function toggleTimer() {
      requestNotificationPermission();
      stopBlinkingTitle();
      if (isRunning) {
        isRunning = false;
        worker.postMessage('stop');
        document.getElementById('startBtn').innerText = 'スタート';
      } else {
        startTimer();
      }
    }

    function startTimer() {
      isRunning = true;
      document.getElementById('startBtn').innerText = '一時停止';
      endTime = (new Date()).getTime() + timeLeft * 1000;
      worker.postMessage('start');
    }

    function checkTimer() {
      var remainingMs = endTime - (new Date()).getTime();
      if (remainingMs <= 0) {
        isRunning = false;
        worker.postMessage('stop');
        document.getElementById('startBtn').innerText = 'スタート';
        
        if (mode === 'focus') {
          switchMode('move');
          sendNotification("🚶‍♂️ そろそろ、うごこ！", focusMinutes + "分経ちました！動くタイムをスタートしましょう。");
        } else {
          switchMode('focus');
          sendNotification("☕ おつかれさまでした！", "休憩終了です。集中タイムに戻りましょう。");
        }
      } else {
        timeLeft = Math.ceil(remainingMs / 1000);
        updateDisplay();
      }
    }
  </script>
</body>
</html>
