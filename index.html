<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>うごこ。</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f5f0;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #333;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 320px;
      text-align: center;
    }
    .chara-img {
      width: 140px;
      height: 140px;
      object-fit: contain;
      margin-bottom: 10px;
    }
    .badge {
      display: inline-block;
      padding: 4px 16px;
      background-color: #e2f0d9;
      color: #557a46;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .timer {
      font-size: 48px;
      font-weight: bold;
      letter-spacing: 2px;
      margin: 10px 0 20px;
      color: #2b2b2b;
    }
    .section-title {
      font-size: 11px;
      color: #888;
      margin-bottom: 6px;
      text-align: left;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .btn-option {
      flex: 1;
      padding: 8px 0;
      background: #f0f0f0;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      color: #555;
    }
    .btn-option.active {
      background: #62a363;
      color: white;
      font-weight: bold;
    }
    .btn-main {
      width: 100%;
      padding: 14px;
      background-color: #62a363;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-main:hover {
      background-color: #4f8550;
    }
  </style>
</head>
<body>

<div class="container">
  <img id="chara" class="chara-img" src="chara-focus.png" alt="キャラクター">
  <div><span id="mode-badge" class="badge">Focus</span></div>
  <div id="timer" class="timer">30:00</div>

  <div class="section-title">Focus</div>
  <div class="btn-group">
    <button class="btn-option" onclick="setFocus(15)">15</button>
    <button class="btn-option active" onclick="setFocus(30)">30</button>
    <button class="btn-option" onclick="setFocus(45)">45</button>
    <button class="btn-option" onclick="setFocus(50)">50</button>
  </div>

  <div class="section-title">Move</div>
  <div class="btn-group">
    <button class="btn-option" onclick="setMove(1)">1</button>
    <button class="btn-option active" onclick="setMove(2)">2</button>
    <button class="btn-option" onclick="setMove(3)">3</button>
    <button class="btn-option" onclick="setMove(5)">5</button>
  </div>

  <button id="start-btn" class="btn-main" onclick="toggleTimer()">スタート</button>
</div>

<script>
  let focusTime = 30 * 60;
  let moveTime = 2 * 60;
  let timeLeft = focusTime;
  let isRunning = false;
  let isFocusMode = true;
  let timerId = null;

  const timerDisplay = document.getElementById('timer');
  const startBtn = document.getElementById('start-btn');
  const charaImg = document.getElementById('chara');
  const modeBadge = document.getElementById('mode-badge');

  // 通知の許可をリクエスト
  if ("Notification" in window && Notification.permission !== "granted") {
    Notification.requestPermission();
  }

  // 「ド・ミ・ソ♪」の音を鳴らす関数
  function playDoMiSo() {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      // ド(C5), ミ(E5), ソ(G5) の周波数
      const notes = [523.25, 659.25, 783.99]; 
      
      notes.forEach((freq, index) => {
        const startTime = audioCtx.currentTime + (index * 0.15); // ポロン・ポロン・ポロンとずらして鳴らす
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'sine'; // やわらかい丸い音
        osc.frequency.setValueAtTime(freq, startTime);
        
        // 音量を滑らかに減衰（余韻を残す）
        gain.gain.setValueAtTime(0.15, startTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.6);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start(startTime);
        osc.stop(startTime + 0.6);
      });
    } catch(e) {
      console.log("Audio not supported");
    }
  }

  // デスクトップ通知を出す関数
  function sendNotification(title, body) {
    if ("Notification" in window && Notification.permission === "granted") {
      new Notification(title, { body: body, icon: isFocusMode ? 'chara-focus.png' : 'chara-move.png' });
    }
  }

  function updateDisplay() {
    const mins = Math.floor(timeLeft / 60).toString().padStart(2, '0');
    const secs = (timeLeft % 60).toString().padStart(2, '0');
    timerDisplay.textContent = `${mins}:${secs}`;
    document.title = `(${mins}:${secs}) うごこ。`;
  }

  function toggleTimer() {
    if ("Notification" in window && Notification.permission === "default") {
      Notification.requestPermission();
    }
    
    if (isRunning) {
      clearInterval(timerId);
      isRunning = false;
      startBtn.textContent = 'スタート';
    } else {
      isRunning = true;
      startBtn.textContent = '一時停止';
      timerId = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          updateDisplay();
        } else {
          // タイマー終了処理：「ド・ミ・ソ♪」を鳴らす
          playDoMiSo();
          
          if (isFocusMode) {
            sendNotification("作業時間終了！", "体を動かしてリフレッシュしましょう！");
            isFocusMode = false;
            timeLeft = moveTime;
            charaImg.src = 'chara-move.png';
            modeBadge.textContent = 'Move';
            modeBadge.style.backgroundColor = '#fbe5d6';
            modeBadge.style.color = '#c55a11';
          } else {
            sendNotification("休憩終了！", "次の集中タイムを始めましょう！");
            isFocusMode = true;
            timeLeft = focusTime;
            charaImg.src = 'chara-focus.png';
            modeBadge.textContent = 'Focus';
            modeBadge.style.backgroundColor = '#e2f0d9';
            modeBadge.style.color = '#557a46';
          }
          updateDisplay();
        }
      }, 1000);
    }
  }

  function setFocus(mins) {
    focusTime = mins * 60;
    if (isFocusMode && !isRunning) {
      timeLeft = focusTime;
      updateDisplay();
    }
  }

  function setMove(mins) {
    moveTime = mins * 60;
    if (!isFocusMode && !isRunning) {
      timeLeft = moveTime;
      updateDisplay();
    }
  }

  updateDisplay();
</script>
</body>
</html>
