<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>うごこ。 | ugoko - 座りっぱなしを、ちょっと減らそう。</title>
  <style>
    :root {
      --bg-color: #F2F4F2;      /* 目に優しいナチュラルグレー */
      --card-bg: #FAFCFA;      /* 温かみのあるオフホワイト */
      --text-main: #2D3531;    /* 落ち着いたダークグリーン */
      --text-sub: #78887F;     /* セージグリーン */
      --accent-green: #68A865; /* やわらかいメイングリーン */
      --border-color: #E0E5E1; /* 柔らかい枠線 */
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    
    /* カードコンテナ */
    .container { width: 100%; max-width: 400px; background: var(--card-bg); border-radius: 24px; padding: 32px 24px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.04); border: 1px solid var(--border-color); text-align: center; }
    
    /* ブランドヘッダー */
    .brand-title { font-size: 32px; font-weight: 700; color: var(--text-main); margin-bottom: 2px; }
    .brand-concept { font-size: 13px; color: var(--text-sub); margin-bottom: 20px; }

    /* キャラクター画像（境界線を馴染ませて中央配置） */
    .chara-img {
      width: 140px;
      height: 140px;
      object-fit: contain;
      display: block;
      margin: 0 auto 12px auto;
      mix-blend-mode: multiply; /* 画像の背景白をカード背景に自然に馴染ませる */
    }

    /* 状態バッジ（完全中央配置） */
    .status-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      background: #E6F0E6;
      color: var(--accent-green);
      margin-bottom: 8px;
    }

    /* タイマー表示（視認性を向上） */
    .timer-display {
      font-size: 64px;
      font-weight: 500;
      letter-spacing: 1px;
      margin: 4px 0 20px;
      color: var(--text-main);
    }

    /* 設定エリア */
    .setting-group { margin-bottom: 16px; text-align: left; }
    .setting-label { font-size: 12px; color: var(--text-sub); margin-bottom: 6px; display: block; }
    .options-grid { display: flex; gap: 6px; }
    .opt-btn { flex: 1; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; padding: 8px 0; font-size: 12px; color: var(--text-main); cursor: pointer; }
    .opt-btn.active { background: var(--accent-green); color: #FFF; border-color: var(--accent-green); font-weight: 600; }
    
    /* スタートボタン（文字間隔と操作感の向上） */
    .start-btn {
      width: 100%;
      background: var(--accent-green);
      color: #FFF;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 2px;
      cursor: pointer;
      margin-top: 12px;
      transition: opacity 0.2s;
    }
    .start-btn:hover { opacity: 0.9; }
    .test-btn { width: 100%; background: transparent; border: none; color: var(--text-sub); font-size: 11px; margin-top: 12px; cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>

  <div class="container">
    <!-- 1. ロゴタイトル -->
    <div class="brand-title">うごこ。</div>
    <div class="brand-concept">座りっぱなしを、ちょっと減らそう。</div>

    <!-- 2. キャラクターイラスト -->
    <img id="charaImg" src="chara-focus.png" alt="うごこ。キャラクター" class="chara-img">
    
    <!-- 3. 状態バッジ -->
    <div id="statusBadge" class="status-badge">集中タイム（Focus）</div>

    <!-- 4. タイマー数字 -->
    <div class="timer-display" id="timerDisplay">30:00</div>

    <!-- 5. 設定グループ -->
    <div class="setting-group">
      <span class="setting-label">集中時間（Focus）</span>
      <div class="options-grid">
        <button class="opt-btn" onclick="setFocusTime(25, this)">25分</button>
        <button class="opt-btn active" onclick="setFocusTime(30, this)">30分</button>
        <button class="opt-btn" onclick="setFocusTime(45, this)">45分</button>
        <button class="opt-btn" onclick="setFocusTime(50, this)">50分</button>
      </div>
    </div>

    <div class="setting-group">
      <span class="setting-label">動く時間（Move）</span>
      <div class="options-grid">
        <button class="opt-btn" onclick="setMoveTime(1, this)">1分</button>
        <button class="opt-btn active" onclick="setMoveTime(2, this)">2分</button>
        <button class="opt-btn" onclick="setMoveTime(3, this)">3分</button>
        <button class="opt-btn" onclick="setMoveTime(5, this)">5分</button>
      </div>
    </div>

    <!-- 6. コントロールボタン -->
    <button class="start-btn" id="startBtn" onclick="toggleTimer()">スタート</button>
    <button class="test-btn" onclick="testTimer(5)">⚡ 5秒テスト（動作確認用）</button>
  </div>

  <script>
    var focusMinutes = 30, moveMinutes = 2, timeLeft = focusMinutes * 60, timerId = null, isRunning = false, endTime = 0;
    var mode = "focus";

    if ("Notification" in window && Notification.permission === "default") {
      Notification.requestPermission();
    }

    function playAudio() {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, ctx.currentTime);
      osc.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.3);
    }

    function sendNotification(title, body) {
      playAudio();
      
      if ("Notification" in window && Notification.permission === "granted") {
        var n = new Notification(title, { body: body });
        n.onclick = function() { startTimer(); window.focus(); };
        n.onclose = function() { if (!isRunning) startTimer(); };
      }
      
      alert(title + "\n" + body);
      startTimer();
    }

    function padZero(n) { return n < 10 ? '0' + n : '' + n; }

    function updateDisplay() {
      var m = padZero(Math.floor(timeLeft / 60));
      var s = padZero(timeLeft % 60);
      document.getElementById('timerDisplay').innerText = m + ':' + s;
      document.title = '(' + m + ':' + s + ') うごこ。';
    }

    function switchMode(newMode) {
      mode = newMode;
      var img = document.getElementById('charaImg');
      var badge = document.getElementById('statusBadge');

      if (mode === 'focus') {
        img.src = 'chara-focus.png';
        badge.innerText = '集中タイム（Focus）';
        badge.style.background = '#E6F0E6';
        badge.style.color = '#68A865';
        timeLeft = focusMinutes * 60;
      } else {
        img.src = 'chara-move.png';
        badge.innerText = '動くタイム（Move）';
        badge.style.background = '#FFF3E0';
        badge.style.color = '#E67E22';
        timeLeft = moveMinutes * 60;
      }
      updateDisplay();
    }

    function setFocusTime(m, el) {
      if (isRunning) return;
      focusMinutes = m;
      if (mode === 'focus') timeLeft = m * 60;
      updateDisplay();
      var btns = el.parentElement.getElementsByTagName('button');
      for (var i = 0; i < btns.length; i++) btns[i].className = 'opt-btn';
      el.className = 'opt-btn active';
    }

    function setMoveTime(m, el) {
      if (isRunning) return;
      moveMinutes = m;
      if (mode === 'move') timeLeft = m * 60;
      updateDisplay();
      var btns = el.parentElement.getElementsByTagName('button');
      for (var i = 0; i < btns.length; i++) btns[i].className = 'opt-btn';
      el.className = 'opt-btn active';
    }

    function testTimer(s) {
      clearInterval(timerId);
      timeLeft = s;
      updateDisplay();
      startTimer();
    }

    function toggleTimer() {
      if (isRunning) {
        clearInterval(timerId);
        isRunning = false;
        document.getElementById('startBtn').innerText = 'スタート';
      } else {
        startTimer();
      }
    }

    function startTimer() {
      isRunning = true;
      document.getElementById('startBtn').innerText = '一時停止';
      endTime = (new Date()).getTime() + timeLeft * 1000;
      clearInterval(timerId);
      timerId = setInterval(checkTimer, 200);
    }

    function checkTimer() {
      var remainingMs = endTime - (new Date()).getTime();
      if (remainingMs <= 0) {
        clearInterval(timerId);
        isRunning = false;
        
        if (mode === 'focus') {
          switchMode('move');
          sendNotification("🚶‍♂️ そろそろ、うごこ！", focusMinutes + "分経ちました！「OK」を押すと" + moveMinutes + "分間の動くタイムがスタートします。");
        } else {
          switchMode('focus');
          sendNotification("☕ おつかれさまでした！", "休憩終了です。「OK」を押すと集中タイムに戻ります。");
        }
      } else {
        timeLeft = Math.ceil(remainingMs / 1000);
        updateDisplay();
      }
    }
  </script>
</body>
</html>
