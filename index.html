<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>座りっぱなし対策タイマー「うごこ。」 | デスクワークの健康管理ツール</title>

  <style>
    :root {
      --bg-color: #F2F4F2;
      --card-bg: #FAFCFA;
      --text-main: #2D3531;
      --text-sub: #78887F;
      --accent-green: #68A865;
      --border-color: #E0E5E1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 12px; }
    
    /* スマホ画面に合わせて可変するよう調整 */
    .container { width: 100%; max-width: 400px; background: var(--card-bg); border-radius: 24px; padding: 24px 18px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.04); border: 1px solid var(--border-color); text-align: center; position: relative; }
    .brand-title { font-size: 28px; font-weight: 700; color: var(--text-main); margin-bottom: 2px; }
    .brand-concept { font-size: 12px; color: var(--text-sub); margin-bottom: 12px; }

    /* 今日の合計座り時間表示 */
    .today-summary {
      background: #E8EFE9;
      border-radius: 12px;
      padding: 8px 12px;
      margin-bottom: 14px;
      font-size: 13px;
      color: var(--text-main);
      font-weight: 600;
    }
    .today-time { font-size: 18px; color: var(--accent-green); font-weight: 700; }

    /* 画面内ポップアップ（スマホ画面下部に大きく表示） */
    .sticky-toast {
      position: fixed;
      bottom: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 360px;
      background: #FFFFFF;
      border-left: 6px solid var(--accent-green);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 9999;
      text-align: left;
      cursor: pointer;
    }
    .sticky-toast.show { bottom: 20px; }
    .toast-title { font-size: 15px; font-weight: 700; color: var(--text-main); margin-bottom: 4px; }
    .toast-body { font-size: 13px; color: var(--text-sub); line-height: 1.5; }
    
    .big-emoji-btn { display: inline-block; font-size: 24px; vertical-align: middle; margin: 0 2px; }

    .chara-img { max-width: 100px; max-height: 100px; width: auto; height: auto; object-fit: contain; display: block; margin: 0 auto 8px auto; }
    .status-badge { display: inline-block; padding: 6px 16px; border-radius: 20px; font-size: 14px; font-weight: 600; background: #E6F0E6; color: var(--accent-green); margin-bottom: 4px; }
    .timer-display { font-size: 58px; font-weight: 500; letter-spacing: 1px; margin: 0 0 12px; color: var(--text-main); }

    .setting-group { margin-bottom: 12px; text-align: left; }
    .setting-label { font-size: 13px; color: var(--text-sub); margin-bottom: 6px; display: block; font-weight: 600; }
    .options-grid { display: flex; gap: 6px; }
    .opt-btn { flex: 1; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 0; font-size: 13px; color: var(--text-main); cursor: pointer; }
    .opt-btn.active { background: var(--accent-green); color: #FFF; border-color: var(--accent-green); font-weight: 700; }
    
    .start-btn { width: 100%; background: var(--accent-green); color: #FFF; border: none; border-radius: 14px; padding: 16px; font-size: 18px; font-weight: 700; letter-spacing: 2px; cursor: pointer; margin-top: 6px; }
    .test-area { margin-top: 12px; padding-top: 8px; border-top: 1px dashed var(--border-color); }
    .test-note { font-size: 11px; color: var(--text-sub); line-height: 1.4; }
    .test-btn { background: transparent; border: none; color: var(--accent-green); font-size: 12px; font-weight: 600; cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>

  <!-- スマホ用画面内ポップアップ -->
  <div id="stickyToast" class="sticky-toast" onclick="handleToastClick()">
    <div class="toast-title" id="toastTitle">🚶‍♂️ そろそろ、うごこ！</div>
    <div class="toast-body" id="toastBody"></div>
  </div>

  <div class="container">
    <div class="brand-title">うごこ。</div>
    <div class="brand-concept">座りっぱなしを、ちょっと減らそう。</div>

    <!-- 今日の座り時間表示機能 -->
    <div class="today-summary">
      今日の座り時間: <span id="todayTimeDisplay" class="today-time">0分</span>
    </div>

    <img id="charaImg" src="chara-focus.png" alt="うごこ。" class="chara-img">
    <div id="statusBadge" class="status-badge">作業タイム</div>
    <div class="timer-display" id="timerDisplay">30:00</div>

    <div class="setting-group">
      <span class="setting-label">作業時間</span>
      <div class="options-grid">
        <button class="opt-btn" onclick="setFocusTime(25, this)">25分</button>
        <button class="opt-btn active" onclick="setFocusTime(30, this)">30分</button>
        <button class="opt-btn" onclick="setFocusTime(45, this)">45分</button>
        <button class="opt-btn" onclick="setFocusTime(50, this)">50分</button>
      </div>
    </div>

    <div class="setting-group">
      <span class="setting-label">うごく時間</span>
      <div class="options-grid">
        <button class="opt-btn" onclick="setMoveTime(1, this)">1分</button>
        <button class="opt-btn active" onclick="setMoveTime(2, this)">2分</button>
        <button class="opt-btn" onclick="setMoveTime(3, this)">3分</button>
        <button class="opt-btn" onclick="setMoveTime(5, this)">5分</button>
      </div>
    </div>

    <button class="start-btn" id="startBtn" onclick="handleStartClick()">スタート</button>
    
    <div class="test-area">
      <button class="test-btn" onclick="testTimer(5)">⚡ 5秒テスト（動作確認用）</button>
      <div class="test-note" style="margin-top: 4px;">↑ テスト確認用ボタンです</div>
    </div>
  </div>

  <script>
    var focusMinutes = 30, moveMinutes = 2, timeLeft = focusMinutes * 60, isRunning = false, endTime = 0;
    var mode = "focus";
    var blinkInterval = null;
    var audioCtx = null;
    var activeNotification = null;
    var todayFocusSeconds = 0;

    var workerCode = `
      let timer = null;
      onmessage = function(e) {
        if (e.data === 'start') {
          if (timer) clearInterval(timer);
          timer = setInterval(() => postMessage('tick'), 250);
        } else if (e.data === 'stop') {
          if (timer) { clearInterval(timer); timer = null; }
        }
      };
    `;
    var workerBlob = new Blob([workerCode], { type: 'application/javascript' });
    var worker = new Worker(URL.createObjectURL(workerBlob));

    worker.onmessage = function() {
      if (isRunning) checkTimer();
    };

    window.onload = function() {
      loadTodayData();
      updateDisplay();
    };

    function loadTodayData() {
      var todayKey = new Date().toISOString().slice(0, 10);
      var savedDate = localStorage.getItem('ugoko_last_date');
      
      if (savedDate !== todayKey) {
        localStorage.setItem('ugoko_last_date', todayKey);
        localStorage.setItem('ugoko_today_seconds', 0);
        todayFocusSeconds = 0;
      } else {
        todayFocusSeconds = parseInt(localStorage.getItem('ugoko_today_seconds') || 0, 10);
      }
      renderTodayTime();
    }

    function renderTodayTime() {
      var totalMinutes = Math.floor(todayFocusSeconds / 60);
      var h = Math.floor(totalMinutes / 60);
      var m = totalMinutes % 60;
      
      var text = "";
      if (h > 0) text += h + "時間 ";
      text += m + "分";

      document.getElementById('todayTimeDisplay').innerText = text;
    }

    function initAudio() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.001);
      } catch(e) {}
    }

    function handleStartClick() {
      initAudio();
      toggleTimer();
    }

    function playAudio() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        var notes = [523.25, 659.25, 783.99];
        notes.forEach(function(freq, index) {
          var startTime = audioCtx.currentTime + (index * 0.15);
          var osc = audioCtx.createOscillator();
          var gain = audioCtx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, startTime);
          gain.gain.setValueAtTime(0.2, startTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.6);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(startTime);
          osc.stop(startTime + 0.6);
        });
      } catch(e) {}
    }

    function showStickyToast(title, mainMessage, emoji, nextModeName) {
      document.getElementById('toastTitle').innerText = title;
      
      var toastBodyHTML = mainMessage + '<br>' +
        'タップして<span class="big-emoji-btn">' + emoji + '</span>『' + nextModeName + '』をはじめよう！';
        
      document.getElementById('toastBody').innerHTML = toastBodyHTML;
      document.getElementById('stickyToast').classList.add('show');
    }

    function closeToast() {
      document.getElementById('stickyToast').classList.remove('show');
      if (activeNotification) {
        activeNotification.close();
        activeNotification = null;
      }
    }

    function handleToastClick() {
      closeToast();
      stopBlinkingTitle();

      if (mode === 'focus') {
        switchMode('move');
      } else {
        switchMode('focus');
      }
      startTimer();
    }

    function startBlinkingTitle(msg) {
      stopBlinkingTitle();
      var toggle = false;
      blinkInterval = setInterval(function() {
        document.title = toggle ? msg : "【うごこ。】";
        toggle = !toggle;
      }, 800);
    }

    function stopBlinkingTitle() {
      if (blinkInterval) {
        clearInterval(blinkInterval);
        blinkInterval = null;
      }
    }

    function sendNotification(title, mainMessage, emoji, nextModeName) {
      try { playAudio(); } catch(e) {}
      startBlinkingTitle("🔔 " + title);
      
      showStickyToast(title, mainMessage, emoji, nextModeName);

      if (document.hidden && "Notification" in window && Notification.permission === "granted") {
        try {
          var notificationText = mainMessage + "\n" +
            "タップして『" + nextModeName + "』をスタート！";

          activeNotification = new Notification(title, { body: notificationText, requireInteraction: true });
          
          activeNotification.onclick = function() {
            window.focus();
            handleToastClick();
          };
        } catch(e) {}
      }
    }

    window.addEventListener('focus', function() {
      if (isRunning) checkTimer();
      else updateDisplay();
    });

    function padZero(n) { return n < 10 ? '0' + n : '' + n; }

    function updateDisplay() {
      var m = padZero(Math.floor(timeLeft / 60));
      var s = padZero(timeLeft % 60);
      document.getElementById('timerDisplay').innerText = m + ':' + s;
      if (!blinkInterval) {
        document.title = '(' + m + ':' + s + ') うごこ。';
      }
    }

    function switchMode(newMode) {
      mode = newMode;
      var img = document.getElementById('charaImg');
      var badge = document.getElementById('statusBadge');

      if (mode === 'focus') {
        img.src = 'chara-focus.png';
        badge.innerText = '作業タイム';
        badge.style.background = '#E6F0E6';
        badge.style.color = '#68A865';
        timeLeft = focusMinutes * 60;
      } else {
        img.src = 'chara-move.png';
        badge.innerText = 'うごくタイム';
        badge.style.background = '#FFF3E0';
        badge.style.color = '#E67E22';
        timeLeft = moveMinutes * 60;
      }
      updateDisplay();
    }

    function setFocusTime(m, el) {
      if (isRunning) return;
      focusMinutes = m;
      if (mode === 'focus') timeLeft = m * 60;
      updateDisplay();
      var btns = el.parentElement.getElementsByTagName('button');
      for (var i = 0; i < btns.length; i++) btns[i].className = 'opt-btn';
      el.className = 'opt-btn active';
    }

    function setMoveTime(m, el) {
      if (isRunning) return;
      moveMinutes = m;
      if (mode === 'move') timeLeft = m * 60;
      updateDisplay();
      var btns = el.parentElement.getElementsByTagName('button');
      for (var i = 0; i < btns.length; i++) btns[i].className = 'opt-btn';
      el.className = 'opt-btn active';
    }

    function testTimer(s) {
      initAudio();
      closeToast();
      stopBlinkingTitle();
      isRunning = false;
      worker.postMessage('stop');
      timeLeft = s;
      updateDisplay();
      toggleTimer();
    }

    function toggleTimer() {
      initAudio();
      closeToast();
      stopBlinkingTitle();
      if (isRunning) {
        isRunning = false;
        worker.postMessage('stop');
        document.getElementById('startBtn').innerText = 'スタート';
      } else {
        startTimer();
      }
    }

    function startTimer() {
      isRunning = true;
      document.getElementById('startBtn').innerText = '一時停止';
      endTime = (new Date()).getTime() + timeLeft * 1000;
      worker.postMessage('start');
    }

    function checkTimer() {
      var remainingMs = endTime - (new Date()).getTime();
      if (remainingMs <= 0) {
        isRunning = false;
        worker.postMessage('stop');
        document.getElementById('startBtn').innerText = 'スタート';
        timeLeft = 0;
        updateDisplay();
        
        if (mode === 'focus') {
          todayFocusSeconds += focusMinutes * 60;
          localStorage.setItem('ugoko_today_seconds', todayFocusSeconds);
          renderTodayTime();

          sendNotification(
            "🚶‍♂️ そろそろ、うごこ！",
            focusMinutes + "分経ちました！身体をほぐしましょう！",
            "🚶‍♂️",
            "うごくタイム"
          );
        } else {
          sendNotification(
            "💻 おつかれさまでした！",
            "リフレッシュ完了！作業に戻りましょう！",
            "💻",
            "作業タイム"
          );
        }
      } else {
        timeLeft = Math.ceil(remainingMs / 1000);
        updateDisplay();
      }
    }
  </script>
</body>
</html>
